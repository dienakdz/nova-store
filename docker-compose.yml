name: nova-store

services:
  db:
    image: mariadb:11.4.12
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    
    # Publish MariaDB ra host để kết nối bằng DBeaver.
    # Host sử dụng port 3308; container vẫn sử dụng port 3306.
    # Chỉ bind localhost để không công khai database ra mạng LAN.
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  wordpress:
    build:
      context: ./docker/wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WP_URL: ${WP_URL:-https://localhost:8443}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', getenv( 'WP_URL' ) ?: 'https://localhost:8443' );
        define( 'WP_SITEURL', getenv( 'WP_URL' ) ?: 'https://localhost:8443' );
    volumes:
      - ./app:/var/www/html

  # Caddy nhận HTTPS từ máy host rồi chuyển request HTTP nội bộ tới Apache/WordPress.
  # `tls internal` tự tạo certificate local; private key chỉ nằm trong Docker volume.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      # Giữ URL HTTP cũ nhưng chuyển nó sang HTTPS thay vì expose Apache trực tiếp.
      - "${WORDPRESS_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # WP-CLI là công cụ quản trị WordPress bằng command line.
  #
  # Service này KHÔNG chạy thường trực và không phục vụ request website.
  # Nó chỉ được tạo tạm thời khi chạy:
  #   docker compose run --rm wpcli <command>
  #
  # Các mục đích sử dụng:
  # - Cài đặt WordPress tự động.
  # - Cài và kích hoạt WooCommerce.
  # - Kích hoạt nova-theme và nova-review-bridge.
  # - Cấu hình permalink, trang Shop, Cart và Checkout.
  # - Tạo danh mục, sản phẩm và review demo.
  # - Chạy các script setup/seed lặp lại được.
  wpcli:
    build:
      context: ./docker
      dockerfile: wpcli/Dockerfile
    image: nova-store-wpcli

    # Ngăn wpcli tự khởi động khi chạy `docker compose up`.
    # Service chỉ chạy khi chúng ta gọi trực tiếp.
    profiles:
      - tools

    # Chỉ chạy WP-CLI sau khi database đã sẵn sàng nhận kết nối.
    depends_on:
      db:
        condition: service_healthy

    environment:
      # WP-CLI cần HOME có quyền ghi để lưu cache và config tạm thời.
      HOME: /tmp
      # Chỉ rõ file config để WP-CLI biết Apache đang bật mod_rewrite.
      WP_CLI_CONFIG_PATH: /etc/wp-cli/config.yml

      # Dùng service name `db`, không dùng localhost.
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-Nova Store}
      WP_TAGLINE: ${WP_TAGLINE:-Thời trang hiện đại cho phong cách hằng ngày}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin_password}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-11.0.1}

    # Tất cả lệnh `wp` được thực hiện tại WordPress document root.
    working_dir: /var/www/html

    # Dùng chung source với container WordPress.
    # Nhờ đó WP-CLI nhìn thấy cùng core, theme và plugin.
    volumes:
      - ./app:/var/www/html
      # Cho phép WP-CLI chạy script seed nằm ngoài WordPress core.
      - ./scripts:/project/scripts:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
